[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-value-tushare-mirror"
version = "0.1.0"
description = "Phase 1 Tushare file lake MVP"
requires-python = ">=3.10"
dependencies = [
  "pyarrow>=14",
  "PyYAML>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.package-data]
"tushare_mirror.endpoint_configs" = ["*.yaml"]
"tushare_mirror.endpoint_configs.inventory" = ["*.yaml"]
