    partition_template: year_month
    primary_date_field: trade_date
    supported_params:
      - ts_code
      - trade_date
      - start_date
      - end_date
    default_fields:
      - ts_code
      - trade_date
      - open
      - high
      - low
      - close
      - pre_close
      - change
      - pct_chg
      - vol
      - amount
    probe:
      params:
        trade_date: '20250103'
      fields:
        - ts_code
        - trade_date
        - close
      allow_empty_probe: false
    page_size: 5000
    risk_level: medium
    required_infra:
      - explicit date planner
      - fake fixture validation
    notes: "Bounded explicit-date index weekly bars; no index-code loop."
