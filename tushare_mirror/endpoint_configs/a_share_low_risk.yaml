  - api_name: ths_index
    family: index_metadata
    market: a
    domain: index
    permission_class: regular
    volume_class: S0_STATIC
    endpoint_kind: index
    planner_kind: single_snapshot
    execution_status: enabled
    partition_template: snapshot_date
    primary_date_field: null
    supported_params:
      - exchange
      - type
    default_params:
      exchange: A
      type: N
    default_fields:
      - ts_code
      - name
      - count
      - exchange
      - list_date
      - type
    probe:
      params:
        exchange: A
        type: N
      fields:
