  - api_name: index_classify
    family: index_metadata
    market: a
    domain: index
    permission_class: regular
    volume_class: S0_STATIC
    endpoint_kind: index
    planner_kind: single_snapshot
    execution_status: enabled
    partition_template: snapshot_date
    primary_date_field: null
    supported_params:
      - index_code
      - level
      - src
    default_params:
      src: SW2021
      level: L1
    default_fields:
      - index_code
      - industry_name
      - level
      - industry_code
      - is_pub
      - parent_code
      - src
    probe:
