    family: hk_reference
    market: hk
    domain: stock
    permission_class: hk_basic
    volume_class: S0_STATIC
    endpoint_kind: hk_us
    planner_kind: single_snapshot
    execution_status: enabled
    partition_template: snapshot_date
    primary_date_field: null
    supported_params: [ts_code, list_status]
    default_params:
      list_status: L
    default_fields: [ts_code, name, fullname, enname, cn_spell, market, list_status, list_date, delist_date, trade_unit, isin, curr_type]
