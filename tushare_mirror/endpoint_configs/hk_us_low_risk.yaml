      params:
        list_status: L
      fields: [ts_code, name, list_status, list_date]
      allow_empty_probe: false
    pagination_mode: none
    risk_level: low
    required_infra:
      - single snapshot fetch
      - fake fixture validation
      - HK/US source probe contract
    doc_url: "https://tushare.pro/document/2?doc_id=191"
    real_probe_status: passed
    notes: "HK reference snapshot. Real bounded probe returned accessible rows without requiring pagination."
    enabled: true

