endpoints:
  - api_name: income_vip
    family: stock_financial
    market: a
    domain: financial
    permission_class: regular
    volume_class: F1_FINANCIAL_PERIOD
    endpoint_kind: financial_statement
    planner_kind: period
    execution_status: enabled
    partition_template: period_year
    primary_date_field: period
    period_field: period
    supported_params:
      - period
      - report_type
    default_params:
      report_type: "1"
    default_fields:
      - ts_code
      - ann_date
      - f_ann_date
      - end_date
      - report_type
      - basic_eps
      - total_revenue
      - revenue
      - oper_cost
      - sell_exp
      - admin_exp
      - fin_exp
      - rd_exp
      - total_profit
      - income_tax
      - n_income
      - n_income_attr_p
      - update_flag
    probe:
      params:
        period: "20241231"
        report_type: "1"
      fields:
        - ts_code
        - ann_date
        - f_ann_date
        - end_date
        - n_income
      allow_empty_probe: true
    page_size: 5000
    risk_level: high
    pit_safety:
      pit_required: true
      requires_disclosure_date: true
      period_field: period
      announcement_date_fields:
        - ann_date
        - f_ann_date
      usable_after_field: ann_date
      fallback_usable_after_policy: block_without_disclosure_date
      allow_without_disclosure_date: false
      lookahead_risk: true
      strategy_safe_default: false
    required_infra:
      - guarded financial raw execution
      - disclosure_date actual_date coverage
      - PIT-safe derived layer
    notes: "A-share period-wide income pull. Raw/lake sync only; not strategy-safe until disclosure_date actual_date is joined."
    enabled: true

