endpoints:
  - api_name: dividend
    family: stock_event
    domain: stock
    volume_class: S2_CODE_DATE
    partition_template: period_year
    primary_date_field: end_date
    supported_params:
      - ts_code
      - ann_date
      - record_date
      - ex_date
      - imp_ann_date
    endpoint_kind: event
    planner_kind: code_date_matrix
    execution_status: disabled
    reason_disabled: "would require stock code traversal guardrails"
    required_infra:
      - explicit code-list source
      - max-code and max-job policy
      - event dedupe policy
    risk_level: high
    notes: "Do not execute until code-loop infrastructure exists."

