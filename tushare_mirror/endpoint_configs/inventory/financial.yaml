endpoints:
  - api_name: income
    endpoint_kind: financial_statement
    planner_kind: code_period_matrix
    execution_status: disabled
    reason_disabled: "financial statements require PIT-safe execution infrastructure"
    required_infra:
      - PIT usable-after derivation
      - code/period matrix planner
      - endpoint-specific fake tests
      - rate-limit policy
    risk_level: high
    period_field: period
    announcement_date_fields:
      - ann_date
      - f_ann_date
    usable_after_field: ann_date
    pit_safety:
      pit_required: true
      period_field: period
      announcement_date_fields:
        - ann_date
        - f_ann_date
      usable_after_field: ann_date
      fallback_usable_after_policy: block_without_disclosure_date
      allow_without_disclosure_date: false
      lookahead_risk: true
      strategy_safe_default: false
      blocked_reason: "execution disabled until PIT validation is implemented"
    notes: "Inventory only. Plan-only period/code-period infrastructure may inspect this metadata, but execution is blocked."

