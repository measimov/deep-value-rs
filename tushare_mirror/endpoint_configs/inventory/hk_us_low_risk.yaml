endpoints:
  - api_name: hk_mins
    family: hk_market_data
    market: hk
    domain: stock
    endpoint_kind: minute_bar
    planner_kind: bucketed_intraday
    execution_status: disabled
    reason_disabled: "HK minute bars are intraday data and outside the low-risk historical mirror goal"
    required_infra:
      - intraday bucket planner
      - storage estimate
      - compaction policy
      - explicit future execution goal
    risk_level: high
    doc_url: "https://tushare.pro/document/2?doc_id=304"
    notes: "Inventory only. No HK minute execution in this goal."

  - api_name: rt_hk_k
    family: hk_realtime
    market: hk
    domain: stock
    endpoint_kind: realtime
    planner_kind: realtime_poll
    execution_status: disabled
    reason_disabled: "HK realtime daily K-line is realtime data and outside the low-risk historical mirror goal"
    required_infra:
      - realtime polling policy
      - retention and rate policy
      - explicit future execution goal
    risk_level: high
    doc_url: "https://tushare.pro/document/2?doc_id=383"
    notes: "Inventory only. No realtime execution in this goal."

  - api_name: hk_income
    family: hk_financial
    market: hk
    domain: financial
    endpoint_kind: financial_statement
    planner_kind: code_period_matrix
    execution_status: disabled
    reason_disabled: "HK financial statements require PIT-safe disclosure-date execution infrastructure"
    required_infra: [PIT usable-after derivation, code/period matrix planner, endpoint-specific fake tests, rate-limit policy]
    risk_level: high
    period_field: period
    announcement_date_fields:
      - ann_date
      - f_ann_date
    usable_after_field: ann_date
    pit_safety:
      pit_required: true
      period_field: period
      announcement_date_fields:
        - ann_date
        - f_ann_date
      usable_after_field: ann_date
      fallback_usable_after_policy: block_without_disclosure_date
      allow_without_disclosure_date: false
      lookahead_risk: true
      strategy_safe_default: false
      blocked_reason: "HK financial execution remains disabled until PIT validation is implemented"
    doc_url: "https://tushare.pro/document/2?doc_id=389"
    notes: "Plan-only inventory. Execution remains blocked."

